    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCDJTaxPlanner - W.Planner Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin="anonymous"></script>
    <!-- html2pdf for PDF Export (มี html2canvas อยู่ข้างใน) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            --neon-yellow: #D4FF00;
            --bg-light: #F4F5F7;
            --text-dark: #111111;
        }

        body {
            font-family: 'Prompt', 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #2A0845 0%, #141E30 100%);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .avoid-page-break {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .pdf-preview-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pdf-paper {
            width: 1122px;
            min-height: 794px;
            background: white;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform-origin: top center;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        @media (max-width: 1200px) { .pdf-paper { transform: scale(0.9); margin-bottom: -10%; } }
        @media (max-width: 1024px) { .pdf-paper { transform: scale(0.75); margin-bottom: -25%; } }
        @media (max-width: 768px) { .pdf-paper { transform: scale(0.6); margin-bottom: -40%; } }
        @media (max-width: 480px) { .pdf-paper { transform: scale(0.35); margin-bottom: -65%; } }
    </style>
</head>

                analysisGroupLifeHealth: "กลุ่มประกันชีวิต & สุขภาพรวม", analysisSelfHealth: "└ เฉพาะประกันสุขภาพตนเอง", analysisGroupRetirement: "กลุ่มเกษียณรวม (PVD+RMF+บำนาญ+กอช.)", analysisPVD: "└ เฉพาะกองทุนสำรองเลี้ยงชีพ/กบข.", analysisRMF: "└ เฉพาะกองทุน RMF", analysisPension: "└ เฉพาะเบี้ยประกันบำนาญ", analysisThaiESG: "กองทุน Thai ESG", analysisThaiESGX: "Thai ESGX (สับเปลี่ยน LTF)", analysisMortgage: "ดอกเบี้ยที่อยู่อาศัย", analysisPolitical: "เงินบริจาคพรรคการเมือง", analysisSE: "วิสาหกิจเพื่อสังคม (SE)", analysisArt: "ค่าซื้องานศิลปะ", analysisSolar: "ติดตั้งโซล่าร์เซลล์", analysisEduDonation: "เงินบริจาค (การศึกษา/รพ.) หัก 2 เท่า", analysisGeneralDonation: "เงินบริจาคทั่วไป",

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num)) return "0.00";
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const parseNumber = (val) => {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') return val;
            const parsed = parseFloat(String(val).replace(/,/g, ''));
            return isNaN(parsed) ? 0 : parsed;
        };

        const calculateTax = (netIncome) => {
            const brackets = [
                { max: 150000, rate: 0, deduction: 0 },
                { max: 300000, rate: 0.05, deduction: 7500 },
                { max: 500000, rate: 0.10, deduction: 27500 },
                { max: 750000, rate: 0.15, deduction: 65000 },
                { max: 1000000, rate: 0.20, deduction: 115000 },
                { max: 2000000, rate: 0.25, deduction: 365000 },
                { max: 5000000, rate: 0.30, deduction: 1265000 },
                { max: Infinity, rate: 0.35, deduction: 1265000 }
            ];

            let tax = 0;
            let bracketTaxes = [];
            let remainingIncome = netIncome;
            let previousMax = 0;

            for (let i = 0; i < brackets.length; i++) {
                const b = brackets[i];
                const taxableInThisBracket = Math.min(Math.max(0, remainingIncome), (b.max - previousMax));
                const taxForBracket = taxableInThisBracket * b.rate;
                
                bracketTaxes.push({
                    min: previousMax + (i === 0 ? 0 : 1),
                    max: b.max,
                    rate: b.rate,
                    tax: taxForBracket
                });

                tax += taxForBracket;
                remainingIncome -= taxableInThisBracket;
                previousMax = b.max;

                if (remainingIncome <= 0) break;
            }

            while (bracketTaxes.length < brackets.length) {
                const b = brackets[bracketTaxes.length];
                bracketTaxes.push({
                    min: previousMax + 1,
                    max: b.max,
                    rate: b.rate,
                    tax: 0
                });
                previousMax = b.max;
            }

            return { totalTax: tax, bracketTaxes };
        };

        const FormattedInput = ({ value, onChange, className = "", readOnly, disabled, highlight = false, alignRight = true, maxValue = Infinity }) => {
            const [isFocused, setIsFocused] = useState(false);
            const [inputValue, setInputValue] = useState(value === 0 ? '' : value);

            useEffect(() => {
                if (!isFocused) {
                    setInputValue(value === 0 ? '' : value);
                }
            }, [value, isFocused]);

            const handleFocus = (e) => {
                if(readOnly || disabled) return;
                setIsFocused(true);
                const target = e.target;
                setTimeout(() => {
                    if (target && target.select) target.select();
                }, 0);
            };
            const handleBlur = () => { setIsFocused(false); };
            const handleChange = (e) => {
                let val = e.target.value;
                const cleanStr = val.replace(/[^0-9.-]/g, '');
                setInputValue(cleanStr);
                
                if (cleanStr === '' || cleanStr === '-') {
                    if (onChange) onChange(0);
                } else if (!cleanStr.endsWith('.')) {
                    const parsed = parseFloat(cleanStr);
                    if (!isNaN(parsed) && onChange) {
                        onChange(parsed);
                    }
                }
            };

            const isExceedLimit = value > maxValue;
            const displayValue = readOnly || disabled 
                ? formatNumber(value) 
                : (isFocused ? inputValue : formatNumber(value));

            let baseClasses = `w-full ${alignRight ? 'text-right' : 'text-left'} p-3.5 text-sm rounded-xl font-inter font-medium transition-all duration-200 outline-none `;
            
            if (readOnly || disabled) {
                baseClasses += "bg-gray-100 text-gray-500 border border-gray-100 cursor-not-allowed ";
            } else if (highlight) {
                baseClasses += "bg-white text-gray-900 border border-gray-300 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 shadow-sm ";
            } else {
                baseClasses += "bg-gray-50 text-gray-900 border border-gray-200 hover:border-gray-300 focus:bg-white focus:border-[#111111] focus:ring-2 focus:ring-[#111111]/50 ";
            }

            if(isExceedLimit) {
                baseClasses += "!text-[#FF453A] !bg-red-50 !border-red-300 focus:!border-red-500 focus:!ring-red-500/50 ";
            }

            return (
                <input
                    type="text"
                    inputMode="decimal"
                    className={`${baseClasses} ${className}`}
                    value={displayValue}
                    onChange={handleChange}
                    onFocus={handleFocus}
                    onBlur={handleBlur}
                    readOnly={readOnly || disabled}
                    disabled={disabled}
                    placeholder="0.00"
                />
            );
        };

        const IncomeCard = ({ title, subTitle, type, hasExpenseLimit, expenseNote, incomes, expenses, withheldTaxes, handleIncomeChange, handleExpenseChange, handleWithheldChange, t }) => (
            <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <h3 className="font-semibold text-gray-900 text-sm">{title}</h3>
                        <p className="text-[11px] text-gray-500 mt-0.5 uppercase tracking-wider">{subTitle}</p>
                    </div>
                </div>
                
                <div className="space-y-4">
                    <div>
                        <label className="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-1.5 block">{t.incomeLabel}</label>
                        <FormattedInput highlight={true} value={incomes[type]} onChange={(val) => handleIncomeChange(type, val)} />
                    </div>
                    
                    <div className="grid grid-cols-2 gap-3">
                        <div>
                            <label className="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-1.5 flex justify-between">
                                <span>{t.expenseLabel}</span>
                            </label>
                            {hasExpenseLimit ? (
                                <div className="relative group">
                                    <FormattedInput readOnly value={expenses[type]} />
                                    <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none opacity-40 text-gray-500">
                                        <i className="fas fa-lock text-[10px]"></i>
                                    </div>
                                </div>
                            ) : (
                                <FormattedInput value={expenses[type]} onChange={(val) => handleExpenseChange(type, val)} />
                            )}
                            {expenseNote && <p className="text-[9px] text-gray-400 mt-1">{expenseNote}</p>}
                        </div>
                        
                        <div>
                            <label className="text-[10px] text-[#A3C400] uppercase tracking-wider font-semibold mb-1.5 block">{t.withheldLabel}</label>
                            <FormattedInput value={withheldTaxes[type]} onChange={(val) => handleWithheldChange(type, val)} />
                        </div>
                    </div>
                    
                    <div className="pt-3 border-t border-gray-100 flex justify-between items-center">
                        <span className="text-[11px] text-gray-500">{t.netIncomeLabel}</span>
                        <span className="font-inter font-medium text-gray-900">{formatNumber(incomes[type] - (expenses[type] || 0))}</span>
                    </div>
                </div>
            </div>
        );

        const DeductionRow = ({ label, limitText, field, valBefore, valAfter, maxValue = Infinity, onChangeBefore, onChangeAfter, isReadOnly = false }) => {
            const isExceedLimit = valAfter > maxValue;

            return (
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center py-4 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors rounded-xl px-2 -mx-2">
                    <div className="w-full md:w-1/2 pr-4 mb-3 md:mb-0">
                        <div className="font-medium text-sm text-gray-900">{label}</div>
                        <div className="text-[11px] text-gray-500 mt-1 tracking-wide">{limitText}</div>
                    </div>
                    <div className="w-full md:w-1/2 flex flex-col space-y-1">
                        <div className="flex space-x-3 w-full">
                            <div className="w-1/2 relative">
                                <FormattedInput value={valBefore} onChange={(val) => onChangeBefore(field, val)} readOnly={isReadOnly} />
                            </div>
                            <div className="w-1/2 relative">
                                <FormattedInput 
                                    value={valAfter} 
                                    onChange={(val) => onChangeAfter(field, val)} 
                                    readOnly={isReadOnly} 
                                    maxValue={maxValue}
                                />
                            </div>
                        </div>
                        {isExceedLimit && (
                            <div className="text-[10px] text-[#FF453A] font-medium mt-1 text-right flex justify-end items-center">
                                <i className="fas fa-exclamation-circle mr-1"></i> ยอดเกินเพดาน {formatNumber(maxValue)} บาท (ส่วนเกินจะไม่นำมาคิด)
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const SectionBadge = ({ text, icon }) => (
            <div className="flex items-center mb-6 mt-8 first:mt-0">
                <div className="bg-gray-100 px-4 py-2 rounded-full text-[10px] font-semibold uppercase tracking-widest text-gray-700 flex items-center shadow-sm">
                    <i className={`fas ${icon} mr-2 text-gray-400`}></i> {text}
                </div>
            </div>
        );

        const IncomePage = ({ incomes, setIncomes, expenses, setExpenses, withheldTaxes, setWithheldTaxes, onNext, t }) => {
            const handleIncomeChange = (type, value) => {
                const numValue = parseNumber(value);
                setIncomes(prev => {
                    const newIncomes = { ...prev, [type]: numValue };
                    if (type === 'salary' || type === 'commission') {
                        const combinedIncome = (newIncomes.salary || 0) + (newIncomes.commission || 0);
                        const autoExpense = Math.min(combinedIncome * 0.5, 100000);
                        setExpenses(exp => ({ ...exp, salary: autoExpense, commission: 0 }));
                    }
                    return newIncomes;
                });
            };

            const handleExpenseChange = (type, value) => { setExpenses(prev => ({ ...prev, [type]: parseNumber(value) })); };
            const handleWithheldChange = (type, value) => { setWithheldTaxes(prev => ({ ...prev, [type]: parseNumber(value) })); };

            const totalIncome = Object.values(incomes).reduce((acc, curr) => acc + curr, 0);
            const totalExpenses = Object.values(expenses).reduce((acc, curr) => acc + curr, 0);
            const totalWithheld = Object.values(withheldTaxes).reduce((acc, curr) => acc + curr, 0);

                                {highestBeforeIdx > highestAfterIdx && (

                                        <i className="fas fa-level-down-alt mr-2"></i>

                                <div className="grid grid-cols-12 text-center pb-2 text-gray-500 text-[10px] uppercase tracking-wider font-semibold border-b border-gray-200 mb-2">
                                    <div className="col-span-4 text-left">{t.netIncomeStep}</div>

                                    <div className="col-span-3 text-right">{t.taxBefore}</div>

                                </div>
                                <div className="space-y-1">
                                    {beforeCalc.bracketTaxes.map((beforeBracket, i) => {
                                        const afterBracket = afterCalc.bracketTaxes[i];
                                        const minText = i === 0 ? "0" : formatNumber(beforeBracket.min).replace(".00", "");
                                        const maxText = beforeBracket.max === Infinity ? t.infinity : formatNumber(beforeBracket.max).replace(".00", "");
                                        const rangeText = beforeBracket.max === Infinity ? `${minText} ${maxText}` : `${minText} - ${maxText}`;
                                        const isActive = beforeBracket.tax > 0 || afterBracket.tax > 0;
                                        
                                        return (
                                            <div key={i} className={`grid grid-cols-12 text-center py-2 px-2 rounded-xl text-xs items-center font-inter ${isActive ? 'bg-white border border-gray-100 shadow-sm' : ''}`}>

                                                    {rangeText}
                                                </div>
                                                <div className={`col-span-2 font-medium ${isActive ? 'text-gray-900' : 'text-gray-400'}`}>
                                                    {beforeBracket.rate === 0 ? t.exempt : `${beforeBracket.rate * 100}%`}
                                                </div>
                                                <div className={`col-span-3 text-right ${beforeBracket.tax > 0 ? 'text-gray-600 font-medium' : 'text-gray-400'}`}>
                                                    {formatNumber(beforeBracket.tax)}
                                                </div>
                                                <div className={`col-span-3 text-right ${afterBracket.tax > 0 ? 'text-[#A3C400] font-bold' : 'text-gray-400'}`}>
                                                    {formatNumber(afterBracket.tax)}

                                            </div>
                                        );

                            </div>

                            {/* Final Results */}
                            <div className="space-y-4 font-prompt mt-2">

                                        <i className="fas fa-hand-holding-usd text-[#A3C400] mr-3 text-lg"></i>
                                        <span className="font-bold text-sm uppercase tracking-wider">{t.withheldPaid}</span>
                                    </div>
                                    <span className="font-inter font-bold text-gray-900 text-lg">{formatNumber(totalWithheldTax)}</span>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {/* Current Side */}
                                    <div className="flex flex-col space-y-3">
                                        <div className="bg-gray-50 p-5 rounded-2xl border border-gray-200 shadow-sm">
                                            <span className="font-bold uppercase tracking-widest text-[9px] mb-1 text-gray-400 block">Current Tax</span>
                                            <span className="font-bold text-sm text-gray-600 block mb-2">{t.currentTaxTotal}</span>
                                            <span className="font-extrabold text-xl lg:text-2xl font-inter tracking-tighter text-gray-900">{formatNumber(beforeCalc.totalTax)}</span>
                                        </div>
                                        <div className={`flex flex-col items-center justify-center p-3 rounded-xl border text-xs font-bold text-center ${beforeCalc.taxPayableOrRefundable > 0 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-gray-50 text-gray-700 border-gray-200'}`}>
                                            <span className="uppercase tracking-widest text-[9px] mb-1 opacity-80">{t.statusCurrent}</span>
                                            <span>{beforeCalc.taxPayableOrRefundable > 0 ? t.payMore + ' ' : t.getRefund + ' '} <br className="hidden lg:block"/> <span className="font-inter text-sm">{formatNumber(Math.abs(beforeCalc.taxPayableOrRefundable))}</span></span>
                                        </div>
                                    </div>

                                    {/* Plan Side */}
                                    <div className="flex flex-col space-y-3">
                                        <div className="bg-[#111111] p-5 rounded-2xl text-white shadow-md">
                                            <span className="font-bold uppercase tracking-widest text-[9px] mb-1 block text-gray-400">Plan Tax</span>
                                            <span className="font-bold text-sm block mb-2">{t.planTaxTotal}</span>
                                            <span className="font-extrabold text-xl lg:text-2xl font-inter tracking-tighter text-[#D4FF00]">{formatNumber(afterCalc.totalTax)}</span>
                                        </div>
                                        <div className={`flex flex-col items-center justify-center p-3 rounded-xl border text-xs font-bold text-center ${afterCalc.taxPayableOrRefundable > 0 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-[#1a1a1a] text-[#D4FF00] border border-[#D4FF00]/50 shadow-[0_0_10px_rgba(212,255,0,0.15)]'}`}>
                                            <span className="uppercase tracking-widest text-[9px] mb-1 opacity-70">{t.statusPlan}</span>
                                            <span>{afterCalc.taxPayableOrRefundable > 0 ? t.payMore + ' ' : t.getRefund + ' '} <br className="hidden lg:block"/> <span className="font-inter text-sm">{formatNumber(Math.abs(afterCalc.taxPayableOrRefundable))}</span></span>
                                        </div>

                                <div className="mt-4 bg-[#111111] rounded-2xl p-5 text-center flex flex-col justify-center items-center shadow-lg border border-gray-800">

                                    <div className="font-inter font-bold text-3xl tracking-tighter text-white flex items-center">
                                        <span className="text-lg text-white/50 mr-2 font-light">฿</span>{formatNumber(taxSaving)}

                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const SummaryPage = ({ 
            incomes, expenses, withheldTaxes, 
            beforeDeductions, afterDeductions, 
            beforeDonations, afterDonations, 
            faRecommendation, calculateTaxScenario,
            onPrev, t 
        }) => {
            const [showPreview, setShowPreview] = useState(false);
            const contentRef = useRef(null);

            const totalIncome = Object.values(incomes).reduce((acc, curr) => acc + curr, 0);
            const totalExpenses = Object.values(expenses).reduce((acc, curr) => acc + curr, 0);
            const totalWithheldTax = Object.values(withheldTaxes).reduce((acc, curr) => acc + curr, 0);
            const assessableIncome = Math.max(0, totalIncome - totalExpenses);

            const beforeCalc = calculateTaxScenario(assessableIncome, totalIncome, totalWithheldTax, beforeDeductions, beforeDonations);
            const afterCalc = calculateTaxScenario(assessableIncome, totalIncome, totalWithheldTax, afterDeductions, afterDonations);
            const taxSaving = beforeCalc.totalTax - afterCalc.totalTax;

            const getHighestBracketIndex = (bracketTaxes, netIncome) => {
                if (netIncome <= 0) return 0;
                let highestIdx = 0;
                for (let i = 0; i < bracketTaxes.length; i++) {
                    if (bracketTaxes[i].tax > 0 || (i === 0 && netIncome > 0)) highestIdx = i;
                }
                return highestIdx;
            };

            const highestBeforeIdx = getHighestBracketIndex(beforeCalc.bracketTaxes, beforeCalc.finalNetIncome);
            const highestAfterIdx = getHighestBracketIndex(afterCalc.bracketTaxes, afterCalc.finalNetIncome);

            const activeIncomes = [
                { label: t.inc1Title, value: incomes.salary },
                { label: t.inc2Title, value: incomes.commission },
                { label: t.inc3Title, value: incomes.royalty },
                { label: t.inc4Title, value: incomes.interest },
                { label: t.inc5Title, value: incomes.rental },
                { label: t.inc6Title, value: incomes.profession },
                { label: t.inc7Title, value: incomes.contractor },
                { label: t.inc8Title, value: incomes.others }
            ].filter(item => item.value > 0);

            const getDeductionLabel = (key) => {
                const labels = {
                    personal: t.deduc1, spouse: t.deduc2, children: t.deduc3, child2018: t.deduc3_1, parents: t.deduc4, disabled: t.deduc5, maternity: t.deduc6,
                    lifeInsurance: t.deduc7, healthInsurance: t.deduc7_1, spouseLifeInsurance: t.deduc8, parentsHealth: t.deduc9,
                    providentFund: t.deduc10, rmf: t.deduc11, pension: t.deduc12, nsf: t.deduc13, thaiesg: t.deduc18, thaiesgX: t.deduc19,
                    socialSecurity: t.deduc14, mortgage: t.deduc15, political: t.deduc16, socialEnterprise: t.deduc17, artPurchase: t.deduc20, solarCell: t.deduc21,
                    eduSport: t.deduc22, general: t.deduc23
                };
                return labels[key] ? labels[key].replace(/^[0-9.]+\s*/, '') : key;
            };

            // แก้ไข: ใช้ "Base Max" แบบ Dynamic เหมือนหน้า Deduction (แชร์ 500k) 
            const getDynamicAfter = (val, baseMax) => {
                const others = afterCalc.sumRetirementRaw - (val || 0);
                const sharedRemaining = Math.max(0, 500000 - others);
                return Math.min(baseMax, sharedRemaining);
            };

            const getDetailMaxLimit = (key) => {
                // คำนวณ Base Max ที่ล็อคเพดาน 500k อย่างถูกต้อง
                const maxPVD_base = Math.min(totalIncome * 0.15, 500000);
                const maxRMF_base = Math.min(totalIncome * 0.30, 500000);
                const maxPension_base = Math.min(totalIncome * 0.15, 200000);

                const limits = {
                    personal: 60000, spouse: 60000, parents: 120000, maternity: 60000,
                    lifeInsurance: 100000, healthInsurance: 25000, spouseLifeInsurance: 10000, parentsHealth: 15000,
                    // ดึงค่า Dynamic แชร์ 500k แบบเดียวกับหน้า Deductions เป๊ะๆ
                    providentFund: getDynamicAfter(afterDeductions.providentFund, maxPVD_base), 
                    rmf: getDynamicAfter(afterDeductions.rmf, maxRMF_base), 
                    pension: getDynamicAfter(afterDeductions.pension, maxPension_base), 
                    nsf: getDynamicAfter(afterDeductions.nsf, 30000),
                    thaiesg: Math.min(totalIncome * 0.30, 300000), thaiesgX: 50000,
                    socialSecurity: 10500, mortgage: 100000, political: 10000, socialEnterprise: 100000, artPurchase: 100000, solarCell: 200000,
                    eduSport: afterCalc.capped.maxEduDonation, general: afterCalc.capped.maxGeneralDonation
                };
                return limits[key] !== undefined ? limits[key] : Infinity;
            };

            const plannedDeductionsWithMax = [
                ...Object.entries(afterDeductions).map(([k, v]) => ({ key: k, label: getDeductionLabel(k), value: v, before: beforeDeductions[k], max: getDetailMaxLimit(k) })),
                ...Object.entries(afterDonations).map(([k, v]) => ({ key: k, label: getDeductionLabel(k), value: (k === 'eduSport' ? v*2 : v), before: (k === 'eduSport' ? beforeDonations[k]*2 : beforeDonations[k]), max: getDetailMaxLimit(k) }))
            ].filter(item => item.value > 0 || item.before > 0);

            const rawAnalysisRows = [
                { label: t.deduc2.replace(/^[0-9.]+\s*/, ''), max: 60000, remaining: Math.max(0, 60000 - afterDeductions.spouse) },
                { label: t.deduc4.replace(/^[0-9.]+\s*/, ''), max: 120000, remaining: Math.max(0, 120000 - afterDeductions.parents) },
                { label: t.deduc6.replace(/^[0-9.]+\s*/, ''), max: 60000, remaining: Math.max(0, 60000 - afterDeductions.maternity) },
                { label: t.deduc8.replace(/^[0-9.]+\s*/, ''), max: 10000, remaining: Math.max(0, 10000 - afterDeductions.spouseLifeInsurance) },
                { label: t.deduc9.replace(/^[0-9.]+\s*/, ''), max: 15000, remaining: Math.max(0, 15000 - afterDeductions.parentsHealth) },
                { label: t.analysisGroupLifeHealth, max: 100000, remaining: Math.max(0, 100000 - (afterDeductions.lifeInsurance + afterDeductions.healthInsurance)) },
                { label: t.analysisSelfHealth, max: 25000, remaining: Math.max(0, 25000 - afterDeductions.healthInsurance) },
                { label: t.analysisGroupRetirement, max: 500000, remaining: Math.max(0, 500000 - afterCalc.sumRetirementRaw) },
                { label: t.analysisThaiESG, max: Math.min(totalIncome * 0.30, 300000), remaining: Math.max(0, Math.min(totalIncome * 0.30, 300000) - afterDeductions.thaiesg) },
                { label: t.analysisThaiESGX, max: 50000, remaining: Math.max(0, 50000 - afterDeductions.thaiesgX) },
                { label: t.analysisMortgage, max: 100000, remaining: Math.max(0, 100000 - afterDeductions.mortgage) },
                { label: t.analysisPolitical, max: 10000, remaining: Math.max(0, 10000 - afterDeductions.political) },
                { label: t.analysisSE, max: 100000, remaining: Math.max(0, 100000 - afterDeductions.socialEnterprise) },
                { label: t.analysisArt, max: 100000, remaining: Math.max(0, 100000 - afterDeductions.artPurchase) },
                { label: t.analysisSolar, max: 200000, remaining: Math.max(0, 200000 - afterDeductions.solarCell) },
            ];
            const analysisRows = rawAnalysisRows.filter(row => row.remaining > 0);

            // ฟังก์ชันถ่ายภาพหน้าพรีวิวให้ตรงปก
            const handlePrintPreviewImage = () => {
                if(!window.html2pdf) return;
                
                const element = document.getElementById('pdf-paper-content');
                if(!element) return;

                const originalFontFamily = element.style.fontFamily;
                element.style.fontFamily = "'Tahoma', 'Arial', sans-serif";
                const allTextNodes = element.querySelectorAll('*');
                const originalStyles = new Map();
                
                allTextNodes.forEach(node => {
                    originalStyles.set(node, node.style.fontFamily);
                    node.style.fontFamily = "'Tahoma', 'Arial', sans-serif";
                });
                
                const btn = document.getElementById('btn-download-pdf');
                if(btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Generating Image...';
                }

                setTimeout(() => {
                    const opt = {
                        margin:       0,
                        filename:     'MCDJTaxPlanner_Summary.png',
                        image:        { type: 'png', quality: 1 },
                        html2canvas:  { 
                            scale: 2, 
                            useCORS: true,
                            letterRendering: true, 
                            windowWidth: 1122 
                        }
                    };

                    window.html2pdf().set(opt).from(element).outputImg('img').then((imgElement) => {
                        const link = document.createElement('a');
                        link.download = 'MCDJTaxPlanner_Summary.png';
                        link.href = imgElement.src;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        element.style.fontFamily = originalFontFamily;
                        allTextNodes.forEach(node => {
                            node.style.fontFamily = originalStyles.get(node) || '';
                        });
                        
                        if(btn) {
                            btn.disabled = false;
                            btn.innerHTML = `<i class="fas fa-image mr-2"></i> SAVE AS IMAGE`;
                        }
                    }).catch(err => {
                        console.error("Image Export Error: ", err);
                        element.style.fontFamily = originalFontFamily;
                        allTextNodes.forEach(node => {
                            node.style.fontFamily = originalStyles.get(node) || '';
                        });
                        if(btn) {
                            btn.disabled = false;
                            btn.innerHTML = `<i class="fas fa-image mr-2"></i> SAVE AS IMAGE`;
                        }
                    });
                }, 300);
            };

            const renderContent = () => {
                return (
                    <div className="space-y-6 w-full overflow-hidden">
                        {/* 1. Hero Banner */}
                        <div className="avoid-page-break w-full mb-6 bg-white overflow-hidden rounded-[2rem]">
                            <div className="hero-gradient p-8 sm:p-10 md:p-14 text-white shadow-lg relative flex flex-col justify-center min-h-[250px] sm:min-h-[300px]">
                                <div className="relative z-10 w-full max-w-2xl">
                                    <h1 className="text-3xl sm:text-4xl md:text-[4rem] font-medium text-white mb-3 sm:mb-4 leading-tight font-poppins tracking-tighter">{t.taxSavedTitle}</h1>
                                    <p className="text-white/80 text-xs sm:text-sm md:text-base font-light mb-6 sm:mb-8 max-w-md">{t.taxSavedDesc}</p>
                                    
                                    <div className="inline-block bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-4 sm:p-6 shadow-sm">
                                        <div className="text-white/70 text-[10px] sm:text-xs font-bold uppercase tracking-widest mb-1">{t.youWillSave}</div>
                                        <div className="text-3xl sm:text-4xl md:text-[3.5rem] font-bold text-white tracking-tighter leading-none flex items-center">
                                            <span className="text-xl sm:text-2xl mr-2 text-white/50 font-light">฿</span> 
                                            {formatNumber(taxSaving)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 2. Active Incomes & FA */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 avoid-page-break mb-6 w-full">
                            <div className="bg-white p-5 sm:p-6 lg:p-8 flex flex-col h-full rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
                                <h3 className="font-bold text-gray-900 text-base sm:text-lg mb-4 border-b border-gray-100 pb-3 truncate">{t.incomeSourcesTitle}</h3>
                                <div className="space-y-3 flex-grow overflow-y-auto pr-2 custom-scrollbar">
                                    {activeIncomes.length > 0 ? activeIncomes.map((item, idx) => (
                                        <div key={idx} className="flex justify-between items-center text-xs sm:text-sm border-b border-gray-50 pb-2 last:border-0 w-full">
                                            <span className="text-gray-600 truncate mr-2">{item.label.split(' ')[0]} {item.label.substring(item.label.indexOf(' ')+1)}</span>
                                            <span className="font-inter font-medium text-gray-900 shrink-0">{formatNumber(item.value)}</span>
                                        </div>
                                    )) : <div className="text-sm text-gray-400 italic text-center py-4">ไม่มีข้อมูลรายได้</div>}
                                </div>
                            </div>
                            
                            <div className={`bg-white p-5 sm:p-6 lg:p-8 flex flex-col h-full rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden ${faRecommendation ? 'border-l-4 border-l-gray-900' : ''}`}>
                                <h3 className="font-bold text-gray-900 text-base sm:text-lg mb-4 border-b border-gray-100 pb-3 flex items-center truncate"><i className="fas fa-comment-dots text-[#D4FF00] mr-2 text-lg sm:text-xl drop-shadow-sm"></i> {t.faRecommendationTitle}</h3>
                                {faRecommendation ? (
                                    <p className="text-gray-800 text-xs sm:text-sm whitespace-pre-wrap leading-relaxed bg-gray-50 p-3 sm:p-4 rounded-xl border border-gray-100 flex-grow font-prompt overflow-y-auto custom-scrollbar w-full">{faRecommendation}</p>
                                ) : (
                                    <div className="flex-grow flex items-center justify-center text-gray-400 text-sm font-light italic w-full">ไม่มีคำแนะนำเพิ่มเติม</div>
                                )}
                            </div>
                        </div>

                        {/* 3. 3 Columns Comparison */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 avoid-page-break mb-6 w-full">
                            {/* Income */}
                            <div className="bg-white p-5 sm:p-6 lg:p-8 flex flex-col rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
                                <div className="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6 border-b border-gray-100 pb-3 sm:pb-4">
                                    <div className="w-8 h-8 sm:w-10 sm:h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-700 shrink-0"><i className="fas fa-wallet text-sm sm:text-base"></i></div>
                                    <h3 className="font-bold text-gray-900 text-base sm:text-lg truncate">{t.incomeCardTitle}</h3>
                                </div>
                                <div className="space-y-3 sm:space-y-4 flex-grow w-full">
                                    <div className="flex justify-between items-center text-xs sm:text-sm w-full"><span className="text-gray-500 truncate mr-2">{t.totalIncomeLabel}</span><span className="font-inter font-medium text-gray-900 shrink-0">{formatNumber(totalIncome)}</span></div>
                                    <div className="flex justify-between items-center text-xs sm:text-sm w-full"><span className="text-gray-500 truncate mr-2">{t.expensesLabel}</span><span className="font-inter font-medium text-red-500 shrink-0">- {formatNumber(totalExpenses)}</span></div>
                                    <div className="pt-3 sm:pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center w-full gap-1"><span className="text-[10px] sm:text-xs font-bold text-gray-500 uppercase">{t.summaryAssessable}</span><span className="font-inter font-bold text-lg sm:text-xl text-gray-900">{formatNumber(assessableIncome)}</span></div>
                                </div>
                            </div>

                            {/* Current */}
                            <div className="bg-white p-5 sm:p-6 lg:p-8 flex flex-col rounded-[2rem] shadow-sm border-t-4 border-t-gray-400 border-x border-b border-gray-100 overflow-hidden">
                                <div className="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6 border-b border-gray-100 pb-3 sm:pb-4">
                                    <div className="w-8 h-8 sm:w-10 sm:h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 shrink-0"><i className="fas fa-chart-line text-sm sm:text-base"></i></div>
                                    <h3 className="font-bold text-gray-700 text-base sm:text-lg truncate">{t.currentCardTitle}</h3>
                                </div>
                                <div className="space-y-3 sm:space-y-4 flex-grow w-full">
                                    <div className="flex justify-between items-center text-xs sm:text-sm w-full"><span className="text-gray-500 truncate mr-2">{t.summaryTotalDeductions}</span><span className="font-inter font-medium text-gray-900 shrink-0">- {formatNumber(beforeCalc.totalDeductions + beforeCalc.actualEduDonation + beforeCalc.actualGeneralDonation)}</span></div>
                                    <div className="flex justify-between items-center text-xs sm:text-sm w-full"><span className="text-gray-500 truncate mr-2">{t.summaryNetIncome}</span><span className="font-inter font-medium text-gray-900 shrink-0">{formatNumber(beforeCalc.finalNetIncome)}</span></div>
                                    <div className="pt-3 sm:pt-4 border-t border-gray-100 flex flex-wrap justify-between items-end w-full gap-1"><span className="text-[10px] sm:text-xs font-bold text-gray-500 uppercase">{t.currentTaxTotal}</span><span className="font-inter font-bold text-xl sm:text-2xl text-gray-900">{formatNumber(beforeCalc.totalTax)}</span></div>
                                </div>
                                <div className="mt-3 sm:mt-4 pt-3 sm:pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center text-[10px] sm:text-xs w-full gap-1">
                                    <span className="text-gray-500 uppercase truncate">{t.withheldPaid}</span>
                                    <span className="font-inter font-medium text-gray-900 shrink-0">{formatNumber(totalWithheldTax)}</span>
                                </div>
                                <div className={`mt-3 flex flex-col items-center justify-center p-2 sm:p-3 rounded-xl border text-[10px] sm:text-xs font-bold text-center w-full ${beforeCalc.taxPayableOrRefundable > 0 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-gray-50 text-gray-700 border-gray-200'}`}>
                                    <span className="uppercase tracking-widest text-[8px] sm:text-[9px] mb-1 opacity-80">{t.statusCurrent}</span>

                        {/* 6. Unused & Available Deductions Table */}

            return (
                <div className="animate-fade-in pb-20 relative">
                    
                    {/* เนื้อหาหลักที่จะแสดงบนเว็บเป็น Layout ธรรมดา */}
                    <div className="space-y-6 w-full max-w-[1100px] mx-auto overflow-hidden">

                    {/* ปุ่ม Navigation & Export */}
                    <div className="flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-4 pt-10">

                            <i className="fas fa-arrow-left mr-3 opacity-50 group-hover:-translate-x-1 transition-transform"></i> {t.backBtn}
                        </button>
                        
                        <button 
                            onClick={() => setShowPreview(true)}
                            className="w-full sm:w-auto bg-gray-900 hover:bg-black text-white font-bold py-3 px-8 rounded-full transition-all flex items-center justify-center group text-sm shadow-sm"
                        >
                            <i className="fas fa-image mr-3 text-[#D4FF00]"></i> {t.showPreviewBtn}
                        </button>
                    </div>

                    {/* Preview Modal: จำลองกระดาษ (1122px) เป๊ะๆ */}
                    {showPreview && (
                        <div className="pdf-preview-container custom-scrollbar">
                            <div className="w-full bg-[#111111] p-3 sm:p-4 flex flex-col sm:flex-row justify-between items-center sticky top-0 z-50 gap-3 sm:gap-0">
                                <div className="text-white font-bold font-poppins flex items-center text-sm sm:text-base">
                                    <i className="fas fa-image text-[#D4FF00] mr-2"></i> Print Preview <span className="text-[10px] sm:text-xs text-gray-400 font-prompt ml-2 sm:ml-3 font-normal">(ขนาดรูปภาพ 1122px)</span>
                                </div>
                                <div className="flex gap-2 sm:gap-3 w-full sm:w-auto">
                                    <button onClick={() => setShowPreview(false)} className="flex-1 sm:flex-none bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-4 sm:px-6 rounded-full text-[10px] sm:text-xs transition-colors">
                                        {t.closePreviewBtn}
                                    </button>
                                    <button id="btn-download-pdf" onClick={handlePrintPreviewImage} className="flex-1 sm:flex-none bg-[#D4FF00] hover:bg-[#bce600] text-black font-bold py-2 px-4 sm:px-6 rounded-full text-[10px] sm:text-xs transition-colors shadow-[0_0_15px_rgba(212,255,0,0.3)]">
                                        <i className="fas fa-image mr-1 sm:mr-2"></i> SAVE AS IMAGE

                            <div className="mt-4 sm:mt-8 mb-10 sm:mb-20 flex justify-center w-full">
                                {/* กล่องกระดาษ (1122px) */}

        const App = () => {
            const [step, setStep] = useState(1);
            const [lang, setLang] = useState('TH');
            const [isLangOpen, setIsLangOpen] = useState(false);
            const t = translations[lang];
            
            const [faRecommendation, setFaRecommendation] = useState('');
            
            const [incomes, setIncomes] = useState({
                salary: 0, commission: 0, royalty: 0, interest: 0,
                rental: 0, profession: 0, contractor: 0, others: 0
            });
            const [expenses, setExpenses] = useState({
                salary: 0, commission: 0, royalty: 0, interest: 0, rental: 0, profession: 0, contractor: 0, others: 0
            });
            const [withheldTaxes, setWithheldTaxes] = useState({
                salary: 0, commission: 0, royalty: 0, interest: 0, rental: 0, profession: 0, contractor: 0, others: 0
            });

            const initialDeductions = {
                personal: 60000, spouse: 0, children: 0, child2018: 0, parents: 0, disabled: 0, maternity: 0,
                lifeInsurance: 0, healthInsurance: 0, spouseLifeInsurance: 0, parentsHealth: 0,
                providentFund: 0, rmf: 0, pension: 0, nsf: 0, thaiesg: 0, thaiesgX: 0,
                socialSecurity: 0, mortgage: 0, political: 0, socialEnterprise: 0, artPurchase: 0, solarCell: 0
            };
            const initialDonations = { eduSport: 0, general: 0 };

            const [beforeDeductions, setBeforeDeductions] = useState({ ...initialDeductions });
            const [beforeDonations, setBeforeDonations] = useState({ ...initialDonations });
            const [afterDeductions, setAfterDeductions] = useState({ ...initialDeductions });
            const [afterDonations, setAfterDonations] = useState({ ...initialDonations });

            const switchStep = (newStep) => {
                setStep(newStep);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const toggleLangDropdown = () => setIsLangOpen(!isLangOpen);
            const selectLanguage = (selectedLang) => {
                setLang(selectedLang);
                setIsLangOpen(false);
            };

            const calculateTaxScenario = (assessableIncome, totalIncome, totalWithheldTax, deducs, dons) => {
                const personal = deducs.personal || 0;
                const spouse = Math.min(deducs.spouse || 0, 60000);
                const children = (deducs.children || 0) + (deducs.child2018 || 0); 
                const parents = Math.min(deducs.parents || 0, 120000); 
                const disabled = deducs.disabled || 0; 
                const maternity = Math.min(deducs.maternity || 0, 60000);

                const healthIns = Math.min(deducs.healthInsurance || 0, 25000);
                const lifeInsRaw = Math.min(deducs.lifeInsurance || 0, 100000);
                const combinedLifeHealth = Math.min(lifeInsRaw + healthIns, 100000);
                const spouseLife = Math.min(deducs.spouseLifeInsurance || 0, 10000);
                const parentsHealth = Math.min(deducs.parentsHealth || 0, 15000);

                // ล็อคเพดาน Base Max ของเกษียณไม่ให้เกิน 500,000 ก่อนเลย
                const maxPVD = Math.min(totalIncome * 0.15, 500000);
                const pvd = Math.min(deducs.providentFund || 0, maxPVD);
                
                const maxRMF = Math.min(totalIncome * 0.30, 500000);
                const rmf = Math.min(deducs.rmf || 0, maxRMF);
                
                const maxPension = Math.min(totalIncome * 0.15, 200000);
                const pension = Math.min(deducs.pension || 0, maxPension);
                
                const nsf = Math.min(deducs.nsf || 0, 30000);
                const sumRetirementRaw = (deducs.providentFund || 0) + (deducs.rmf || 0) + (deducs.pension || 0) + (deducs.nsf || 0);
                const cappedRetirement = Math.min(sumRetirementRaw, 500000);

                const thaiesg = Math.min(deducs.thaiesg || 0, totalIncome * 0.30, 300000);
                const thaiesgX = Math.min(deducs.thaiesgX || 0, 50000); 

                const socialSec = Math.min(deducs.socialSecurity || 0, 10500);
                const mortgage = Math.min(deducs.mortgage || 0, 100000);
                const political = Math.min(deducs.political || 0, 10000);
                const socialEnterprise = Math.min(deducs.socialEnterprise || 0, 100000);
                const artPurchase = Math.min(deducs.artPurchase || 0, 100000);
                const solarCell = Math.min(deducs.solarCell || 0, 200000);

                const rawTotalDeductions = Object.values(deducs).reduce((acc, curr) => acc + curr, 0);
                const totalDeductions = rawTotalDeductions - sumRetirementRaw + cappedRetirement;

                const netIncomeBeforeDonations = Math.max(0, assessableIncome - totalDeductions);
                
                const maxEduDonation = netIncomeBeforeDonations * 0.10;
                const actualEduDonation = Math.min((dons.eduSport || 0) * 2, maxEduDonation);
                
                const netIncomeAfterEdu = netIncomeBeforeDonations - actualEduDonation;
                const maxGeneralDonation = netIncomeAfterEdu * 0.10;
                const actualGeneralDonation = Math.min(dons.general || 0, maxGeneralDonation);
                
                const finalNetIncome = Math.max(0, netIncomeAfterEdu - actualGeneralDonation);
                const taxResult = calculateTax(finalNetIncome);
                const taxPayableOrRefundable = taxResult.totalTax - totalWithheldTax;

                return {
                    capped: { maxEduDonation, maxGeneralDonation },
                    sumRetirementRaw, totalDeductions, actualEduDonation, actualGeneralDonation, finalNetIncome,
                    totalTax: taxResult.totalTax, bracketTaxes: taxResult.bracketTaxes, taxPayableOrRefundable,
                    maxRMF, maxPension, maxPVD
                };
            };

            return (
                <div className="flex-grow flex flex-col font-prompt relative z-10 w-full">
                    <header className="bg-white/80 backdrop-blur-xl border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                        <div className="container mx-auto px-6 py-4 flex justify-between items-center max-w-7xl">
                            <div className="flex items-center space-x-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-full bg-black flex items-center justify-center shadow-md shrink-0">
                                        <div className="w-3.5 h-3.5 rounded-full bg-[#D4FF00]"></div>
                                    </div>
                                    <h1 className="text-xl sm:text-2xl font-medium tracking-normal text-gray-900 font-poppins">{t.appTitle}</h1>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-3">
                                <div className="hidden sm:flex bg-gray-100 rounded-full p-1 border border-gray-200 shadow-inner">
                                    <button onClick={() => switchStep(1)} className={`px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all ${step === 1 ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}>{t.step1}</button>
                                    <button onClick={() => switchStep(2)} className={`px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all ${step === 2 ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}>{t.step2}</button>
                                    <button onClick={() => switchStep(3)} className={`px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all ${step === 3 ? 'bg-[#111111] text-white shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}>{t.step3}</button>
                                </div>

                                <div className="relative z-50 ml-2">
                                    <button onClick={toggleLangDropdown} className="bg-white border border-gray-200 hover:border-gray-300 text-gray-700 px-4 py-2 rounded-full flex items-center text-xs font-bold transition-all shadow-sm">
                                        <i className="fas fa-globe mr-2 text-gray-400"></i> {lang} <i className="fas fa-chevron-down ml-2 text-[10px] text-gray-400"></i>
                                    </button>
                                    {isLangOpen && (
                                        <div className="absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden z-50">
                                            {['TH', 'EN', 'ZH', 'JA', 'KO'].map((l) => (
                                                <button key={l} onClick={() => selectLanguage(l)} className={`w-full text-left px-4 py-3 text-xs font-medium hover:bg-gray-50 transition-colors ${lang === l ? 'text-gray-900 font-bold bg-gray-50' : 'text-gray-600'}`}>
                                                    {l === 'TH' ? '🇹🇭 ไทย' : l === 'EN' ? '🇬🇧 English' : l === 'ZH' ? '🇨🇳 中文' : l === 'JA' ? '🇯🇵 日本語' : '🇰🇷 한국어'}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto mt-8 px-4 sm:px-6 lg:px-8 max-w-7xl flex-grow pb-12">
                        {step === 1 && (
                            <IncomePage 
                                incomes={incomes} setIncomes={setIncomes}
                                expenses={expenses} setExpenses={setExpenses}
                                withheldTaxes={withheldTaxes} setWithheldTaxes={setWithheldTaxes}
                                onNext={() => switchStep(2)} t={t}
                            />
                        )}
                        {step === 2 && (
                            <DeductionsPage 
                                incomes={incomes} expenses={expenses} withheldTaxes={withheldTaxes}
                                beforeDeductions={beforeDeductions} setBeforeDeductions={setBeforeDeductions}
                                afterDeductions={afterDeductions} setAfterDeductions={setAfterDeductions}
                                beforeDonations={beforeDonations} setBeforeDonations={setBeforeDonations}
                                afterDonations={afterDonations} setAfterDonations={setAfterDonations}
                                faRecommendation={faRecommendation} setFaRecommendation={setFaRecommendation}
                                calculateTaxScenario={calculateTaxScenario}
                                onPrev={() => switchStep(1)} onNext={() => switchStep(3)} t={t}
                            />
                        )}
                        {step === 3 && (
                            <SummaryPage 
                                incomes={incomes} expenses={expenses} withheldTaxes={withheldTaxes}
                                beforeDeductions={beforeDeductions} afterDeductions={afterDeductions}
                                beforeDonations={beforeDonations} afterDonations={afterDonations}
                                faRecommendation={faRecommendation} calculateTaxScenario={calculateTaxScenario}
                                onPrev={() => switchStep(2)} t={t}
                            />
                        )}
                    </main>

                    <footer className="mt-auto py-6 border-t border-gray-200 bg-white/50 backdrop-blur-sm">
                        <div className="container mx-auto px-6 text-center max-w-7xl">
                            <p className="text-xs text-gray-400 font-inter tracking-wide">
                                &copy; {new Date().getFullYear()} <span className="font-semibold text-gray-500">MCDJ WEALTH ADVISOR Co.,Ltd.</span> All rights reserved. 
                                <br className="sm:hidden" />
                                <span className="hidden sm:inline"> | </span> 
                                <span className="font-prompt">สงวนลิขสิทธิ์ ห้ามทำซ้ำ ดัดแปลง หรือลอกเลียนแบบ</span>
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return <div className="text-gray-900 text-center p-10 mt-20 text-xl font-poppins">Something went wrong. Please reload.</div>;
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
